<!DOCTYPE html>
<html>
    <head>
        <title>my to do list</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>My To-Do List</h1>
        <form>
            <input type="text" placeholder="Add a new task..." id="todo-input">
            <button type="submit">Add</button>
            
        </form>
        <div class="board">
        <div id="todo" class="column">
            <h2>TO Do</h2>
            <ul id="todo-list"></ul>
        </div>
        <div id="inprogress" class="column">
            <h2>In Progress</h2>
            <ul id="inprogress-list"></ul>
        </div>
        <div id="completed" class="column">
            <h2>Completed</h2>
            <ul id="completed-list"></ul>
        </div>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
